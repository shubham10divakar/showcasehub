# Sample nginx config for hosting the production build on a VPS.
# Build first:  npm run build   ->  outputs to ./build
# Copy ./build to the server, e.g. /var/www/showcasehub/build
#
# This serves the SPA at the domain root (https://subhamdivakar.com/).
# The `try_files ... /index.html` line is the key piece: it makes
# client-side routes (e.g. /publications/3) work on refresh / direct hit,
# replacing the GitHub Pages 404.html redirect trick.

server {
    listen 80;
    server_name subhamdivakar.com www.subhamdivakar.com;

    root /var/www/showcasehub/build;
    index index.html;

    # SPA fallback for React Router (BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed CRA assets are immutable — cache them hard
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache the HTML shell, so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# For HTTPS, run certbot after the above is live:
#   sudo certbot --nginx -d subhamdivakar.com -d www.subhamdivakar.com
# certbot will add the listen 443 / ssl_certificate lines and an HTTP->HTTPS redirect.
